name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # No secrets.properties in CI: app/build.gradle.kts treats a missing file
      # as an empty Gemini key, so the build compiles and the app reports
      # "LLM not configured". Unit tests never call the live API.
      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parentsync-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
